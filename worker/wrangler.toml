name = "expense-tracker-sms-relay"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Create with: wrangler kv namespace create SMS_RELAY_KV
# then paste the returned id below.
[[kv_namespaces]]
binding = "SMS_RELAY_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (never put these here) — set with:
#   wrangler secret put RELAY_TOKEN
